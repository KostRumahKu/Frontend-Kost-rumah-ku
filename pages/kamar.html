<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pilihan Kamar | KostRumahKu</title>
  <meta name="description" content="Pilih tipe kamar KostRumahKu: Standar, Tulip, dan Amarilis." />
  <link rel="icon" href="/public/favicon.ico" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/mobile-bottom-nav.css" />
</head>

<body class="flex min-h-dvh flex-col overflow-x-hidden bg-[var(--color-cream)] font-[family-name:var(--font-body)] text-[var(--color-ink)] md:h-dvh md:overflow-hidden">

  <!-- Navbar desktop -->
  <header id="top-nav" class="hidden shrink-0 shadow-sm md:block"></header>

  <!-- Header mobile -->
  <header class="flex shrink-0 items-center justify-between bg-[var(--color-primary)] px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))] text-[var(--color-cream)] md:hidden">
    <a href="/" class="flex items-center gap-2 font-[family-name:var(--font-heading)] text-base font-semibold tracking-[0.04em]">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3L12 3Z" /></svg>
      KostRumahKu
    </a>
  </header>

  <!-- Konten utama -->
  <main class="relative mx-auto flex min-h-0 w-full max-w-[90rem] flex-1 flex-col justify-center overflow-x-hidden px-3 py-4 pb-24 sm:px-6 md:px-10 md:py-2 md:pb-2 lg:px-12">

    <!-- Judul Halaman (Bahasa Indonesia) -->
    <div class="mb-4 shrink-0 text-center md:mb-5">
      <p class="font-[family-name:var(--font-heading)] text-xl font-medium leading-tight tracking-[0.04em] text-[var(--color-primary)] md:text-2xl">Pilih Kamar</p>
      <h1 class="mt-1 font-[family-name:var(--font-heading)] text-3xl italic font-normal leading-[1.12] tracking-[0.015em] text-[var(--color-primary-dark)] sm:text-4xl md:text-[2.5rem]">
        Nyamanmu di Sini
      </h1>
      <p id="ringkasan-ketersediaan" class="mt-2 hidden font-[family-name:var(--font-body)] text-xs font-normal tracking-[0.025em] text-[var(--color-muted)]"></p>
    </div>

    <!-- Wrapper Carousel (2 kartu tampil sekaligus di desktop + panah loop kiri/kanan) -->
    <div class="relative flex items-center gap-1 sm:gap-2">

      <!-- Tombol Panah Kiri (loop tanpa mentok) -->
      <button id="btn-prev" type="button" aria-label="Tipe kamar sebelumnya"
        class="z-20 flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-[var(--color-primary)]/20 bg-[var(--color-cream)] text-[var(--color-primary)] shadow-md transition-all duration-200 ease-out hover:border-[var(--color-primary-dark)] hover:bg-[var(--color-primary-dark)] hover:text-[var(--color-cream)] hover:shadow-lg active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]/40 sm:h-11 sm:w-11 lg:-mr-3 lg:h-12 lg:w-12">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.25" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
      </button>

      <!-- Viewport Slider -->
      <div id="slider-viewport" class="min-w-0 flex-1 overflow-hidden px-1 py-2 sm:px-3 lg:px-4">
        <div id="kamar-track" class="flex gap-6 will-change-transform">
          <!-- Kartu kamar dirender oleh JS -->
        </div>
      </div>

      <!-- Tombol Panah Kanan (loop tanpa mentok) -->
      <button id="btn-next" type="button" aria-label="Tipe kamar berikutnya"
        class="z-20 flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-[var(--color-primary)]/20 bg-[var(--color-cream)] text-[var(--color-primary)] shadow-md transition-all duration-200 ease-out hover:border-[var(--color-primary-dark)] hover:bg-[var(--color-primary-dark)] hover:text-[var(--color-cream)] hover:shadow-lg active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]/40 sm:h-11 sm:w-11 lg:-ml-3 lg:h-12 lg:w-12">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.25" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
      </button>
    </div>

    <!-- Tab Tipe Kamar (Standar, Tulip, Amarilis) -->
    <div class="mt-3.5 flex shrink-0 justify-center md:mt-4">
      <div id="slider-dots" role="tablist" aria-label="Pilih tipe kamar"
        class="inline-flex items-center gap-1 rounded-full border border-[var(--color-primary)]/15 bg-[var(--color-surface)] p-1 shadow-xs">
      </div>
    </div>

    <!-- Dialog Detail Tipe Kamar (Konsep Traveloka + Tema KostRumahKu) -->
    <dialog id="dlg-detail-kamar" class="m-auto w-[calc(100%-1.5rem)] max-w-5xl overflow-hidden rounded-2xl bg-[var(--color-surface)] p-0 text-[var(--color-ink)] shadow-2xl backdrop:bg-black/65">
      <div class="flex max-h-[88dvh] flex-col">
        <!-- Header Modal -->
        <div class="flex shrink-0 items-center justify-between gap-3 border-b border-[var(--color-primary)]/15 bg-[var(--color-surface)] px-5 py-3.5 md:px-6">
          <div class="flex flex-wrap items-center gap-2.5">
            <h2 id="dlg-judul" class="font-[family-name:var(--font-heading)] text-lg font-semibold text-[var(--color-ink)] md:text-xl">Detail Kamar</h2>
            <span id="dlg-badge" class="rounded-full bg-[var(--color-cream)] px-3 py-0.5 text-xs font-semibold text-[var(--color-primary)]"></span>
          </div>
          <button type="button" data-close aria-label="Tutup" class="cursor-pointer rounded-lg p-1.5 text-[var(--color-muted)] transition-colors hover:bg-black/5 hover:text-[var(--color-ink)]">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <!-- Body Split 2 Kolom: Kiri Galeri Foto Gelap, Kanan Info Scroll + Sticky Harga -->
        <div class="grid min-h-0 flex-1 overflow-y-auto lg:grid-cols-12 lg:overflow-hidden">

          <!-- Kolom Kiri: Galeri Foto + Thumbnails -->
          <div class="flex flex-col bg-[#221711] text-[var(--color-cream)] lg:col-span-7 lg:min-h-0">
            <!-- Foto Utama + Panah Geser -->
            <div class="relative flex h-64 items-center justify-center overflow-hidden bg-black/30 sm:h-80 lg:min-h-0 lg:flex-1">
              <img id="dlg-main-img" src="/public/img/halaman.webp" alt="Foto kamar" class="h-full w-full object-cover" />

              <button id="dlg-img-prev" type="button" aria-label="Foto sebelumnya"
                class="absolute left-3 top-1/2 flex h-9 w-9 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-[var(--color-surface)]/95 text-[var(--color-primary)] shadow-md transition-colors hover:bg-[var(--color-primary)] hover:text-[var(--color-cream)]">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
              </button>

              <button id="dlg-img-next" type="button" aria-label="Foto berikutnya"
                class="absolute right-3 top-1/2 flex h-9 w-9 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-[var(--color-surface)]/95 text-[var(--color-primary)] shadow-md transition-colors hover:bg-[var(--color-primary)] hover:text-[var(--color-cream)]">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
              </button>
            </div>

            <!-- Strip Thumbnail Bawah -->
            <div class="shrink-0 bg-[#1a110c] px-4 py-3">
              <div class="mb-2 flex items-center justify-between text-xs text-[var(--color-cream)]/85">
                <span id="dlg-galeri-label" class="font-medium">Foto Kamar</span>
                <span id="dlg-galeri-counter" class="font-mono text-[11px] text-[var(--color-cream)]/70">1/1</span>
              </div>
              <div id="dlg-thumbs" class="flex gap-2 overflow-x-auto pb-0.5"></div>
            </div>
          </div>

          <!-- Kolom Kanan: Info Kamar Scrollable + Footer Harga Sticky -->
          <div class="flex flex-col bg-[var(--color-surface)] lg:col-span-5 lg:min-h-0">
            <div id="dlg-body" class="flex-1 space-y-5 overflow-y-auto p-5 text-sm"></div>

            <!-- Sticky Footer Harga & Tombol Pesan -->
            <div class="shrink-0 border-t border-[var(--color-primary)]/15 bg-[var(--color-surface)] p-4 shadow-[0_-4px_12px_rgba(43,29,20,0.06)]">
              <p class="font-[family-name:var(--font-body)] text-xs text-[var(--color-muted)]">Harga mulai dari</p>
              <div class="mt-0.5 flex items-baseline gap-1.5">
                <span id="dlg-harga" class="font-[family-name:var(--font-heading)] text-2xl font-bold tracking-[0.01em] text-[var(--color-primary)]">—</span>
                <span class="font-[family-name:var(--font-body)] text-xs text-[var(--color-muted)]">/ bulan</span>
              </div>
              <a id="dlg-btn-pesan" href="/pesan"
                class="mt-3 flex h-11 w-full items-center justify-center rounded-xl bg-[var(--color-primary)] px-5 font-[family-name:var(--font-body)] text-sm font-semibold tracking-[0.02em] text-[var(--color-cream)] shadow-sm transition-all duration-200 hover:bg-[var(--color-primary-dark)] active:scale-[0.99]">
                Pesan Kamar Ini
              </a>
            </div>
          </div>

        </div>
      </div>
    </dialog>
  </main>

  <div id="bottom-nav" class="shrink-0 md:hidden"></div>

  <script type="module">
    try {
      const r = await fetch('/config');
      window.__ENV__ = await r.json();
    } catch { window.__ENV__ = {}; }
    await import('/src/pages/kamar.js');
  </script>
</body>
</html>
