<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tagihan | KostRumahKu</title>
  <link rel="icon" href="/public/favicon.ico" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body class="flex h-dvh overflow-hidden bg-[var(--color-cream)] font-[family-name:var(--font-body)] text-[var(--color-ink)]">

  <aside id="sidebar" class="hidden shrink-0 md:block"></aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-black/10 bg-[var(--color-surface)] px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))] md:px-8 md:py-4">
      <div>
        <h1 class="font-[family-name:var(--font-heading)] text-xl font-semibold md:text-2xl">Tagihan</h1>
        <p class="text-sm text-[var(--color-muted)]">Kelola pembayaran sewa bulananmu</p>
      </div>
      <button id="logout-mobile" type="button"
        class="rounded-lg border border-[var(--color-primary)]/30 px-4 py-2 text-sm font-medium text-[var(--color-primary)] transition-colors hover:bg-[var(--color-primary)]/5 md:hidden">
        Keluar
      </button>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto p-4 pb-28 md:p-8 md:pb-8">
      <p id="page-error" role="alert" class="mb-5 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800"></p>
      <p id="page-success" role="status" class="mb-5 hidden rounded-xl bg-green-50 px-4 py-3 text-sm text-green-800"></p>

      <!-- Tagihan Bulan Ini -->
      <section class="mb-6">
        <!-- Skeleton -->
        <div id="skeleton-bulan-ini" class="animate-pulse rounded-2xl border border-[var(--color-primary)]/15 bg-[var(--color-surface)] p-6 shadow-sm">
          <div class="grid gap-6 md:grid-cols-3 md:items-center">
            <div class="space-y-2.5">
              <div class="h-4 w-32 rounded bg-[var(--color-primary)]/10"></div>
              <div class="h-8 w-48 rounded bg-[var(--color-primary)]/15"></div>
              <div class="h-3 w-36 rounded bg-[var(--color-primary)]/10"></div>
            </div>
            <div class="space-y-2.5">
              <div class="h-4 w-20 rounded bg-[var(--color-primary)]/10"></div>
              <div class="h-11 w-44 rounded-lg bg-[var(--color-primary)]/10"></div>
              <div class="h-3 w-40 rounded bg-[var(--color-primary)]/10"></div>
            </div>
            <div class="flex md:justify-end">
              <div class="h-12 w-44 rounded-lg bg-[var(--color-primary)]/15"></div>
            </div>
          </div>
        </div>

        <!-- Kartu Tagihan Bulan Ini -->
        <div id="konten-bulan-ini" class="hidden rounded-2xl border border-[var(--color-primary)]/20 bg-[var(--color-surface)] p-6 shadow-sm">
          <div class="grid gap-6 md:grid-cols-3 md:items-center">
            <!-- Kiri: Judul, Nominal, Periode -->
            <div>
              <h2 id="judul-tagihan-aktif" class="font-[family-name:var(--font-heading)] text-lg font-semibold text-[var(--color-ink)]">Tagihan Bulan Ini</h2>
              <p id="tagihan-jumlah" class="mt-1.5 text-2xl font-bold tracking-tight text-[var(--color-primary)] md:text-3xl">—</p>
              <p id="tagihan-bulan" class="mt-1.5 text-xs font-medium text-[var(--color-muted)]">Periode : —</p>
            </div>

            <!-- Tengah: Status & Jatuh Tempo -->
            <div class="flex flex-col items-start">
              <span class="text-sm font-semibold text-[var(--color-primary)]">Status</span>
              <span id="tagihan-status-badge" class="mt-1.5 inline-flex min-w-[11rem] items-center justify-center rounded-lg border px-5 py-2 text-sm font-semibold">—</span>
              <p id="tagihan-jatuh-tempo" class="mt-2 text-xs font-medium text-[var(--color-muted)]">Jatuh Tempo : —</p>
            </div>

            <!-- Kanan: Aksi Bayar (ke halaman pembayaran) -->
            <div class="flex items-center md:justify-end">
              <a id="btn-bayar" href="/penghuni/pembayaran"
                class="hidden min-w-[11rem] items-center justify-center gap-3 rounded-lg border border-[var(--color-primary)]/35 bg-[var(--color-cream)]/60 px-6 py-2.5 text-sm font-semibold text-[var(--color-primary)] transition-colors hover:bg-[var(--color-primary)] hover:text-[var(--color-cream)]">
                <span class="flex h-6 w-6 items-center justify-center rounded-full bg-[var(--color-primary)] text-[var(--color-cream)]" aria-hidden="true">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" /></svg>
                </span>
                <span>Bayar</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Belum ada tagihan bulan ini -->
        <p id="tidak-ada-tagihan" class="hidden rounded-2xl border border-[var(--color-primary)]/15 bg-[var(--color-surface)] px-6 py-8 text-center text-sm text-[var(--color-muted)] shadow-sm">
          Tidak ada tagihan bulan ini.
        </p>
      </section>

      <!-- Riwayat -->
      <section>
        <div class="overflow-hidden rounded-2xl border border-[var(--color-primary)]/10 bg-[var(--color-surface)] shadow-sm">
          <div class="flex items-center gap-2.5 border-b border-[var(--color-primary)]/10 px-6 py-4">
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-[var(--color-primary)]/10 text-[var(--color-primary)]">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </span>
            <h2 class="font-[family-name:var(--font-heading)] text-base font-semibold text-[var(--color-primary)]">Riwayat Tagihan</h2>
          </div>

          <!-- Skeleton riwayat -->
          <div id="skeleton-riwayat" class="animate-pulse divide-y divide-[var(--color-primary)]/5">
            <div class="grid grid-cols-5 gap-4 px-6 py-4">
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/15"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-20 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-12 rounded-full bg-[var(--color-primary)]/10"></div>
            </div>
            <div class="grid grid-cols-5 gap-4 px-6 py-4">
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/15"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-20 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-12 rounded-full bg-[var(--color-primary)]/10"></div>
            </div>
            <div class="grid grid-cols-5 gap-4 px-6 py-4">
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/15"></div>
              <div class="h-3 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-20 rounded-full bg-[var(--color-primary)]/10"></div>
              <div class="h-5 w-12 rounded-full bg-[var(--color-primary)]/10"></div>
            </div>
          </div>

          <!-- Tabel -->
          <div id="tabel-riwayat" class="hidden overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-[var(--color-primary)]/10 text-left text-xs font-medium uppercase tracking-wide text-[var(--color-muted)]">
                  <th class="px-6 py-3">Periode</th>
                  <th class="px-6 py-3">Jumlah</th>
                  <th class="px-6 py-3">Jatuh Tempo</th>
                  <th class="px-6 py-3">Status</th>
                  <th class="px-6 py-3">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-riwayat" class="divide-y divide-[var(--color-primary)]/5"></tbody>
            </table>
          </div>

          <p id="riwayat-kosong" class="hidden px-6 py-8 text-center text-sm text-[var(--color-muted)]">
            Belum ada riwayat tagihan.
          </p>
        </div>
      </section>

      <!-- Dialog Detail -->
      <dialog id="dlg-detail" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl bg-[var(--color-surface)] p-0 shadow-xl backdrop:bg-black/50">
        <div class="p-6">
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-[family-name:var(--font-heading)] text-lg font-semibold">Detail Tagihan</h3>
            <button type="button" data-close aria-label="Tutup" class="rounded-lg p-1.5 hover:bg-black/5">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div id="detail-body" class="mt-4"></div>
          <div id="detail-footer" class="mt-5 flex flex-wrap justify-end gap-2 border-t border-[var(--color-primary)]/10 pt-4"></div>
        </div>
      </dialog>
    </main>
  </div>

  <div id="bottom-nav" class="md:hidden"></div>

  <script type="module">
    try { const r = await fetch('/config'); window.__ENV__ = await r.json(); }
    catch { window.__ENV__ = {}; }
    await import('/src/pages/penghuni/tagihan.js');
  </script>
</body>
</html>
