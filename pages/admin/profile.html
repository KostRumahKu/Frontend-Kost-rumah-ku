<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profile | KostRumahKu</title>
  <link rel="icon" href="/public/favicon.ico" />

  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body class="flex h-dvh overflow-hidden bg-[var(--color-cream)] font-[family-name:var(--font-body)] text-[var(--color-ink)]">

  <aside id="sidebar" class="hidden shrink-0 md:block"></aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-black/10 bg-[var(--color-surface)] px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))] md:px-8 md:py-4">
      <div>
        <h1 class="font-[family-name:var(--font-heading)] text-xl font-semibold md:text-2xl">Profile</h1>
        <p class="text-sm text-[var(--color-muted)]">Data akun dan keamanan</p>
      </div>
      <button id="logout-mobile" type="button" class="rounded-lg border border-[var(--color-primary)]/30 px-4 py-2 text-sm font-medium text-[var(--color-primary)] md:hidden">Keluar</button>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto p-4 pb-28 md:p-8 md:pb-8">
      <p id="page-error" role="alert" class="mb-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
      <p id="page-success" role="status" class="mb-4 hidden rounded-lg bg-green-50 px-4 py-3 text-sm text-green-800"></p>

      <div class="grid gap-6 lg:grid-cols-2">
        <section aria-labelledby="judul-profil" class="rounded-xl bg-[var(--color-surface)] p-5 shadow-sm md:p-6">
          <h2 id="judul-profil" class="font-[family-name:var(--font-heading)] text-lg font-semibold">Data akun</h2>
          <div id="ringkas" class="mt-4"></div>
          <p id="profil-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
          <p id="profil-sukses" role="status" class="mt-4 hidden rounded-lg bg-green-50 px-4 py-3 text-sm text-green-800"></p>
          <form id="form-profil" class="mt-4 space-y-4" novalidate></form>
        </section>

        <section aria-labelledby="judul-sandi" class="rounded-xl bg-[var(--color-surface)] p-5 shadow-sm md:p-6 lg:self-start">
          <h2 id="judul-sandi" class="font-[family-name:var(--font-heading)] text-lg font-semibold">Ganti password</h2>
          <p id="sandi-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
          <p id="sandi-sukses" role="status" class="mt-4 hidden rounded-lg bg-green-50 px-4 py-3 text-sm text-green-800"></p>
          <form id="form-sandi" class="mt-4 space-y-4" novalidate></form>
        </section>
      </div>
    </main>
  </div>

  <!-- Bar bawah (mobile), diisi oleh src/components/admin-nav.js -->
  <div id="bottom-nav" class="md:hidden"></div>

  <script type="module">
    try {
      const r = await fetch('/config');
      window.__ENV__ = await r.json();
    } catch { window.__ENV__ = {}; }

    await import('/src/pages/admin/profile.js');
  </script>
</body>
</html>
