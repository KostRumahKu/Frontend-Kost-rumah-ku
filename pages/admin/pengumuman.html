<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pengumuman | KostRumahKu</title>
  <link rel="icon" href="/public/favicon.ico" />

  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body class="flex h-dvh overflow-hidden bg-[var(--color-cream)] font-[family-name:var(--font-body)] text-[var(--color-ink)]">

  <aside id="sidebar" class="hidden shrink-0 md:block"></aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-black/10 bg-[var(--color-surface)] px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))] md:px-8 md:py-4">
      <div>
        <h1 class="font-[family-name:var(--font-heading)] text-xl font-semibold md:text-2xl">Pengumuman</h1>
        <p class="text-sm text-[var(--color-muted)]">Dikirim ke email semua penyewa aktif</p>
      </div>
      <button id="logout-mobile" type="button" class="rounded-lg border border-[var(--color-primary)]/30 px-4 py-2 text-sm font-medium text-[var(--color-primary)] md:hidden">Keluar</button>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto p-4 pb-28 md:p-8 md:pb-8">
      <div class="grid gap-6 lg:grid-cols-5">

        <!-- Form buat pengumuman -->
        <section aria-labelledby="judul-form" class="rounded-xl bg-[var(--color-surface)] p-5 shadow-sm lg:col-span-2 lg:self-start">
          <h2 id="judul-form" class="font-[family-name:var(--font-heading)] text-lg font-semibold">Buat pengumuman</h2>

          <p id="form-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
          <p id="form-success" role="status" class="mt-4 hidden rounded-lg bg-green-50 px-4 py-3 text-sm text-green-800"></p>

          <form id="form-pengumuman" class="mt-4 space-y-4" novalidate>
            <div>
              <label for="judul" class="mb-1.5 block text-sm font-medium">Judul</label>
              <input id="judul" name="judul" type="text" autocomplete="off"
                class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-4 py-2.5 focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
            </div>

            <div>
              <label for="pesan" class="mb-1.5 block text-sm font-medium">Pesan</label>
              <textarea id="pesan" name="pesan" rows="6"
                class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-4 py-2.5 focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700"></textarea>
            </div>

            <div>
              <label for="gambar" class="mb-1.5 block text-sm font-medium">Link gambar <span class="font-normal text-[var(--color-muted)]">(opsional)</span></label>
              <input id="gambar" name="gambar" type="url" inputmode="url" placeholder="https://..." autocomplete="off"
                class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-4 py-2.5 placeholder:text-[var(--color-muted)]/70 focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
            </div>

            <button id="submit-btn" type="submit" class="w-full rounded-lg bg-[var(--color-primary)] py-3 font-medium text-[var(--color-cream)] transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-60">Kirim pengumuman</button>
          </form>
        </section>

        <!-- Riwayat -->
        <section aria-labelledby="judul-riwayat" class="lg:col-span-3">
          <h2 id="judul-riwayat" class="font-[family-name:var(--font-heading)] text-lg font-semibold">Riwayat pengumuman</h2>
          <p id="riwayat-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
          <div id="riwayat" class="mt-4 space-y-4" aria-live="polite">
            <p class="text-sm text-[var(--color-muted)]">Memuat riwayat...</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div id="bottom-nav" class="md:hidden"></div>

  <script type="module">
    try {
      const r = await fetch('/api/client-config');
      window.__ENV__ = await r.json();
    } catch { window.__ENV__ = {}; }

    await import('/src/pages/admin/pengumuman.js');
  </script>
</body>
</html>
