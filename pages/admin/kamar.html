<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kamar | KostRumahKu</title>
  <link rel="icon" href="/public/favicon.ico" />

  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body class="flex h-dvh overflow-hidden bg-[var(--color-cream)] font-[family-name:var(--font-body)] text-[var(--color-ink)]">

  <aside id="sidebar" class="hidden shrink-0 md:block"></aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-black/10 bg-[var(--color-surface)] px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))] md:px-8 md:py-4">
      <div>
        <h1 class="font-[family-name:var(--font-heading)] text-xl font-semibold md:text-2xl">Kamar</h1>
        <p id="jumlah" class="text-sm text-[var(--color-muted)]"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-tambah" type="button" class="rounded-lg bg-[var(--color-primary)] px-4 py-2 text-sm font-medium text-[var(--color-cream)] transition-colors hover:bg-[var(--color-primary-dark)]">Tambah kamar</button>
        <button id="logout-mobile" type="button" class="rounded-lg border border-[var(--color-primary)]/30 px-4 py-2 text-sm font-medium text-[var(--color-primary)] md:hidden">Keluar</button>
      </div>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto p-4 pb-28 md:p-8 md:pb-8">

      <!-- Filter -->
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label for="filter-status" class="mb-1 block text-xs font-medium text-[var(--color-muted)]">Status</label>
          <select id="filter-status" class="rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50">
            <option value="">Semua</option>
            <option value="kosong">Kosong</option>
            <option value="dipesan">Dipesan</option>
            <option value="terisi">Terisi</option>
            <option value="perbaikan">Perbaikan</option>
          </select>
        </div>
        <div>
          <label for="filter-lantai" class="mb-1 block text-xs font-medium text-[var(--color-muted)]">Lantai</label>
          <select id="filter-lantai" class="rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50">
            <option value="">Semua</option>
          </select>
        </div>
        <label class="flex items-center gap-2 pb-2 text-sm">
          <input id="filter-arsip" type="checkbox" class="h-4 w-4 accent-[var(--color-primary)]" />
          Lihat kamar yang diarsipkan
        </label>
      </div>

      <p id="page-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
      <p id="page-success" role="status" class="mt-4 hidden rounded-lg bg-green-50 px-4 py-3 text-sm text-green-800"></p>

      <div id="daftar" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-live="polite">
        <p class="text-sm text-[var(--color-muted)]">Memuat daftar kamar...</p>
      </div>
    </main>
  </div>

  <div id="bottom-nav" class="md:hidden"></div>

  <!-- ===== Dialog: tambah / ubah kamar ===== -->
  <dialog id="dlg-form" aria-labelledby="dlg-form-title" class="m-auto max-h-[90dvh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl bg-[var(--color-surface)] p-0 text-[var(--color-ink)] shadow-xl backdrop:bg-black/50">
    <div class="p-5 sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="dlg-form-title" class="font-[family-name:var(--font-heading)] text-xl font-semibold"></h2>
        <button type="button" data-close aria-label="Tutup" class="rounded-lg p-2 hover:bg-black/5"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>

      <p id="form-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>

      <form id="form-kamar" class="mt-4 space-y-4" novalidate>
        <p id="f-info" data-only="edit" class="hidden rounded-lg bg-[var(--color-cream)] px-4 py-3 text-sm text-[var(--color-muted)]"></p>

        <div data-only="edit" class="hidden">
          <label for="f-nama" class="mb-1.5 block text-sm font-medium">Nama kamar</label>
          <input id="f-nama" type="text" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
        </div>

        <div data-only="add">
          <label for="f-tipe" class="mb-1.5 block text-sm font-medium">Tipe kamar</label>
          <input id="f-tipe" type="text" autocomplete="off" placeholder="contoh: ekonomi" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm placeholder:text-[var(--color-muted)]/70 focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
        </div>

        <div data-only="add" class="grid grid-cols-2 gap-4">
          <div>
            <label for="f-lantai" class="mb-1.5 block text-sm font-medium">Lantai</label>
            <input id="f-lantai" type="number" inputmode="numeric" min="1" max="2" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
          <div>
            <label for="f-harga" class="mb-1.5 block text-sm font-medium">Harga / bulan (Rp)</label>
            <input id="f-harga" type="number" inputmode="numeric" min="0" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
        </div>

        <div>
          <label for="f-status" class="mb-1.5 block text-sm font-medium">Status <span class="font-normal text-[var(--color-muted)]">(opsional)</span></label>
          <select id="f-status" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50">
            <option value="">Biarkan default</option>
            <option value="kosong">Kosong</option>
            <option value="dipesan">Dipesan</option>
            <option value="terisi">Terisi</option>
            <option value="perbaikan">Perbaikan</option>
          </select>
        </div>

        <div>
          <label for="f-foto" class="mb-1.5 block text-sm font-medium">Foto <span class="font-normal text-[var(--color-muted)]">(opsional, satu link atau nama file per baris)</span></label>
          <textarea id="f-foto" rows="3" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" data-close class="rounded-lg border border-[var(--color-primary)]/40 px-5 py-2.5 text-sm font-medium text-[var(--color-primary)] hover:bg-[var(--color-primary)]/5">Batal</button>
          <button id="f-submit" type="submit" class="rounded-lg bg-[var(--color-primary)] px-5 py-2.5 text-sm font-medium text-[var(--color-cream)] transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-60">Simpan</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ===== Dialog: detail kamar ===== -->
  <dialog id="dlg-detail" aria-labelledby="dlg-detail-title" class="m-auto max-h-[90dvh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl bg-[var(--color-surface)] p-0 text-[var(--color-ink)] shadow-xl backdrop:bg-black/50">
    <div class="p-5 sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="dlg-detail-title" class="font-[family-name:var(--font-heading)] text-xl font-semibold"></h2>
        <button type="button" data-close aria-label="Tutup" class="rounded-lg p-2 hover:bg-black/5"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>
      <p id="detail-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>
      <div id="detail-body" class="mt-4"></div>
      <div id="detail-actions" class="mt-6 flex flex-wrap gap-3"></div>
    </div>
  </dialog>

  <!-- ===== Dialog: tambah penghuni ===== -->
  <dialog id="dlg-penghuni" aria-labelledby="dlg-penghuni-title" class="m-auto max-h-[90dvh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl bg-[var(--color-surface)] p-0 text-[var(--color-ink)] shadow-xl backdrop:bg-black/50">
    <div class="p-5 sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="dlg-penghuni-title" class="font-[family-name:var(--font-heading)] text-xl font-semibold"></h2>
        <button type="button" data-close aria-label="Tutup" class="rounded-lg p-2 hover:bg-black/5"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>

      <p id="penghuni-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>

      <form id="form-penghuni" class="mt-4 space-y-4" novalidate>
        <fieldset>
          <legend class="mb-2 text-sm font-medium">Jenis input</legend>
          <label class="mr-5 inline-flex items-center gap-2 text-sm"><input type="radio" name="mode" value="manual" checked class="accent-[var(--color-primary)]" /> Penghuni baru</label>
          <label class="inline-flex items-center gap-2 text-sm"><input type="radio" name="mode" value="lama" class="accent-[var(--color-primary)]" /> Data penghuni lama</label>
          <p id="mode-note" class="mt-2 text-xs text-[var(--color-muted)]"></p>
        </fieldset>

        <div>
          <label for="p-nama" class="mb-1.5 block text-sm font-medium">Nama lengkap</label>
          <input id="p-nama" type="text" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="p-email" class="mb-1.5 block text-sm font-medium">Email</label>
            <input id="p-email" type="email" inputmode="email" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
          <div>
            <label for="p-telp" class="mb-1.5 block text-sm font-medium">Nomor telepon</label>
            <input id="p-telp" type="tel" inputmode="tel" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="p-darurat-nama" class="mb-1.5 block text-sm font-medium">Kontak darurat (nama)</label>
            <input id="p-darurat-nama" type="text" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
          <div>
            <label for="p-darurat-telp" class="mb-1.5 block text-sm font-medium">Kontak darurat (telepon)</label>
            <input id="p-darurat-telp" type="tel" inputmode="tel" autocomplete="off" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
        </div>
        <div class="grid gap-4 sm:grid-cols-3">
          <div>
            <label for="p-durasi" class="mb-1.5 block text-sm font-medium">Durasi (bulan)</label>
            <input id="p-durasi" type="number" inputmode="numeric" min="1" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
          <div>
            <label for="p-mulai" class="mb-1.5 block text-sm font-medium">Tanggal mulai</label>
            <input id="p-mulai" type="date" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50 aria-[invalid=true]:border-red-700" />
          </div>
          <div>
            <label for="p-metode" class="mb-1.5 block text-sm font-medium">Pembayaran</label>
            <select id="p-metode" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50">
              <option value="tunai">Tunai</option>
              <option value="transfer">Transfer</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" data-close class="rounded-lg border border-[var(--color-primary)]/40 px-5 py-2.5 text-sm font-medium text-[var(--color-primary)] hover:bg-[var(--color-primary)]/5">Batal</button>
          <button id="p-submit" type="submit" class="rounded-lg bg-[var(--color-primary)] px-5 py-2.5 text-sm font-medium text-[var(--color-cream)] transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-60">Simpan penghuni</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ===== Dialog: pindah kamar ===== -->
  <dialog id="dlg-pindah" aria-labelledby="dlg-pindah-title" class="m-auto max-h-[90dvh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl bg-[var(--color-surface)] p-0 text-[var(--color-ink)] shadow-xl backdrop:bg-black/50">
    <div class="p-5 sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="dlg-pindah-title" class="font-[family-name:var(--font-heading)] text-xl font-semibold"></h2>
        <button type="button" data-close aria-label="Tutup" class="rounded-lg p-2 hover:bg-black/5"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>

      <p id="pindah-error" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"></p>

      <form id="form-pindah" class="mt-4 space-y-4" novalidate>
        <p id="pindah-info" class="text-sm text-[var(--color-muted)]"></p>
        <div>
          <label for="pindah-tujuan" class="mb-1.5 block text-sm font-medium">Kamar tujuan (yang kosong)</label>
          <select id="pindah-tujuan" class="w-full rounded-lg border border-[var(--color-primary)]/30 bg-white px-3 py-2.5 text-sm focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)]/50"></select>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" data-close class="rounded-lg border border-[var(--color-primary)]/40 px-5 py-2.5 text-sm font-medium text-[var(--color-primary)] hover:bg-[var(--color-primary)]/5">Batal</button>
          <button id="pindah-submit" type="submit" class="rounded-lg bg-[var(--color-primary)] px-5 py-2.5 text-sm font-medium text-[var(--color-cream)] transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-60">Pindahkan</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module">
    try {
      const r = await fetch('/api/client-config');
      window.__ENV__ = await r.json();
    } catch { window.__ENV__ = {}; }

    await import('/src/pages/admin/kamar.js');
  </script>
</body>
</html>
